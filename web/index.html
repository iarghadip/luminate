<!DOCTYPE html>
<html lang="en" class="full-height">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>{SETUP_INTERFACE_TITLE}</title>
        <link rel="stylesheet" type="text/css" href="/index.css">
        <script type="text/javascript" src="/index.js"></script>
    </head>
    <body class="full-height">
        <div class="header">
            {FIRMWARE_VERSION}
        </div>
        <div class="flex-center full-height">
            <form autocomplete="off" class="form mb-4" action="/setup/save" method="post" novalidate>
                <div class="control mb-2">
                    <h1 id="message">Connect Luminate to Wi-Fi?</h1>
                </div>
                <div id="screen-1">
                    <div class="control block-cube block-input">
                        <input name="{KEY_WIFI_SSID}" placeholder="SSID (2.4 GHz Only)" type="text">
                        <div class="bg-top">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg-right">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg">
                            <div class="bg-inner"></div>
                        </div>
                    </div>
                    <div class="control block-cube block-input">
                        <input name="{KEY_WIFI_PASSWORD}" placeholder="Password" type="password">
                        <div class="bg-top">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg-right">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg">
                            <div class="bg-inner"></div>
                        </div>
                    </div>
                </div>
                <div id="screen-2">
                    <div class="control block-cube block-input">
                        <input name="{KEY_BRIGHTNESS_CYCLE}" placeholder="Cycle Hour (Eg: 6)" min="0" max="23" type="number">
                        <div class="bg-top">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg-right">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg">
                            <div class="bg-inner"></div>
                        </div>
                    </div>
                    <div class="control block-cube block-input">
                        <input name="{KEY_BRIGHTNESS_MINIMUM}" placeholder="Minimum Brightness %" min="0" max="50" type="number">
                        <div class="bg-top">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg-right">
                            <div class="bg-inner"></div>
                        </div>
                        <div class="bg">
                            <div class="bg-inner"></div>
                        </div>
                    </div>
                </div>
                <button class="btn block-cube block-cube-hover mb-2" type="submit">
                    <div class="bg-top">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg-right">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="text">
                        Save Network
                    </div>
                </button>
            </form>
            <div class="footer">
                <div class="container">
                </div>
            </div>
        </div>
    </body>
</html>
