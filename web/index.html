<!DOCTYPE html>
<html lang="en" class="full-height">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>{SETUP_INTERFACE_TITLE}</title>
        <style>
            @keyframes rotate {
                0%{ transform: rotate(0deg); }
                100%{ transform: rotate(360deg); }	
            }
            *,
            ::after,
            ::before {
                box-sizing: border-box;
            }
            body {
                background-color: #212121;
                color: #fff;
                font-family: monospace, serif;
                letter-spacing: 0.05em;
                margin: 0;
                overflow: hidden;
            }
            h1 {
                font-size: 23px;
            }
            .form {
                width: 300px;
                padding: 0px 15px 24px;
                margin: 0 auto;
            }
            .form .control {
                margin: 0 0 24px;
            }
            .form .control input {
                width: 100%;
                padding: 14px 16px;
                border: 0;
                background: transparent;
                color: #fff;
                font-family: monospace, serif;
                letter-spacing: 0.05em;
                font-size: 16px;
            }
            .form .control input:hover,
            .form .control input:focus {
                outline: none;
                border: 0;
            }
            .form .btn {
                width: 100%;
                display: block;
                padding: 14px 16px;
                background: transparent;
                outline: none;
                border: 0;
                color: #fff;
                letter-spacing: 0.1em;
                font-weight: bold;
                font-family: monospace;
                font-size: 16px;
            }
            .btn {
                cursor: pointer;
            }
            .block-cube {
                position: relative;
            }
            .block-cube .bg-top {
                position: absolute;
                height: 10px;
                background: #020024;
                background: linear-gradient(90deg, #020024 0%, #340979 37%, #00d4ff 94%);
                bottom: 100%;
                left: 5px;
                right: -5px;
                transform: skew(-45deg, 0);
                margin: 0;
            }
            .block-cube .bg-top .bg-inner {
                bottom: 0;
            }
            .block-cube .bg {
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
                bottom: 0;
                background: #020024;
                background: linear-gradient(90deg, #020024 0%, #340979 37%, #00d4ff 94%);
            }
            .block-cube .bg-right {
                position: absolute;
                background: #020024;
                background: #00d4ff;
                top: -5px;
                z-index: 0;
                bottom: 5px;
                width: 10px;
                left: 100%;
                transform: skew(0, -45deg);
            }
            .block-cube .bg-right .bg-inner {
                left: 0;
            }
            .block-cube .bg .bg-inner {
                transition: all 0.2s ease-in-out;
            }
            .block-cube .bg-inner {
                background: black;
                position: absolute;
                left: 2px;
                top: 2px;
                right: 2px;
                bottom: 2px;
            }
            .block-cube .text {
                position: relative;
                z-index: 2;
            }
            .block-cube.block-input input {
                position: relative;
                z-index: 2;
            }
            .block-cube.block-input input:focus ~ .bg-right .bg-inner,
            .block-cube.block-input input:focus ~ .bg-top .bg-inner,
            .block-cube.block-input input:focus ~ .bg-inner .bg-inner {
                top: 100%;
                background: rgba(255, 255, 255, 0.5);
            }
            .block-cube.block-input .bg-top,
            .block-cube.block-input .bg-right,
            .block-cube.block-input .bg {
                background: rgba(255, 255, 255, 0.5);
                transition: background 0.2s ease-in-out;
            }
            .block-cube.block-input .bg-right .bg-inner,
            .block-cube.block-input .bg-top .bg-inner {
                transition: all 0.2s ease-in-out;
            }
            .block-cube.block-input:focus .bg-top,
            .block-cube.block-input:focus .bg-right,
            .block-cube.block-input:focus .bg,
            .block-cube.block-input:hover .bg-top,
            .block-cube.block-input:hover .bg-right,
            .block-cube.block-input:hover .bg {
                background: rgba(255, 255, 255, 0.8);
            }
            .block-cube.block-cube-hover:focus .bg .bg-inner,
            .block-cube.block-cube-hover:hover .bg .bg-inner {
                top: 100%;
            }
            .footer {
                position: fixed;
                left: 0;
                bottom: 0;
                padding: 15px 15px;
                width: 100%;
                z-index: -1;
            }
            .container {
                height: 300px;
                width: 300px;
                position: absolute;
                top: 50%;
                left: 50%;
                margin: -150px 0 0 -150px;
            }
            .square {
                height: 94%;
                width: 94%;
                background: white;
                position: absolute;
                top: 50%;
                left: 50%;
                margin: -47% 0 0 -47%;
            }
            .black { 
                background: black;  
                animation: rotate 50s infinite linear; 
            }
            .flex-center {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .full-height {
                height: 100vh;
            }
            .d-none {
                display: none;
            }
            .mb-2 {
                margin-bottom: 48px !important;
            }
            .mb-4 {
                margin-bottom: 96px !important;
            }
        </style>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                let setMessageID = null;
                function setMessage(text, reset = true) {
                    const e = document.getElementById("message");
                    if (setMessageID !== null) {
                        clearTimeout(setMessageID);
                        setMessageID = null;
                    }
                    if (reset) {
                        setMessageID = setTimeout(() => {
                            e.textContent = 'Connect Luminate to Wi-Fi?';
                            setMessageID = null;
                        }, 2500);
                    }
                    e.textContent = text;
                }
                function parseJSON(response) {
                    try {
                        return JSON.parse(response);
                    } catch {
                        return JSON.parse(
                            response
                                .replace(/'/g, '"')
                                .replace(/,\s*([}\]])/g, '$1')
                                .trim()
                        );
                    }
                }
                function isValidInput(ssid, password) {
                    return (
                        typeof ssid == "string" &&
                        typeof password == "string" &&
                        ssid.length >= 1 &&
                        ssid.length <= 32 &&
                        password.length >= 8 &&
                        password.length <= 63
                    );
                }
                const form = document.querySelector("form");
                const submit = form.querySelector("button[type=submit]");
                form.addEventListener("submit", e => {
                    e.preventDefault();
                    const ssid = form.querySelector("input[name='{KEY_WIFI_SSID}']").value;
                    const password = form.querySelector("input[name='{KEY_WIFI_PASSWORD}']").value;
                    if (!isValidInput(ssid, password)) {
                        setMessage("SSID or Password is invalid!");
                        return;
                    }
                    submit.querySelector(".text").textContent = "Saving...";
                    form.querySelectorAll("input, button").forEach(e => e.disabled = true);
                    setTimeout(() => {
                        fetch("/wifi/save", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },
                            body: new URLSearchParams({
                                '{KEY_WIFI_SSID}': ssid,
                                '{KEY_WIFI_PASSWORD}': password
                            })
                        })
                        .then(r => r.text())
                        .then(response => {
                            const json = parseJSON(response);
                            if (json.success) {
                                setMessage(`Luminate is connected to ${ssid}.`);
                                submit.querySelector(".text").textContent = "Completed";
                            } else {
                                throw new Error(json.message || `Could not connect to ${ssid}!`);
                            }
                            console.log("response:", json);
                        })
                        .catch(e => {
                            setMessage(e.message || "Something went wrong!");
                            submit.querySelector(".text").textContent = "Save Network";
                            form.querySelectorAll("input, button").forEach(e => e.disabled = false);
                        });
                    }, 1000);
                });
            });
        </script>
    </head>
    <body class="full-height">
        <div class="flex-center full-height">
            <form autocomplete="off" class="form mb-4" action="/wifi/save" method="post" novalidate>
                <div class="control mb-2">
                    <h1 id="message">Connect Luminate to Wi-Fi?</h1>
                </div>
                <div class="control block-cube block-input">
                    <input name="{KEY_WIFI_SSID}" placeholder="SSID (2.4 GHz Only)" type="text">
                    <div class="bg-top">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg-right">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg">
                        <div class="bg-inner"></div>
                    </div>
                </div>
                <div class="control block-cube block-input">
                    <input name="{KEY_WIFI_PASSWORD}" placeholder="Password" type="password">
                    <div class="bg-top">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg-right">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg">
                        <div class="bg-inner"></div>
                    </div>
                </div>
                <button class="btn block-cube block-cube-hover mb-2" type="submit">
                    <div class="bg-top">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg-right">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="bg">
                        <div class="bg-inner"></div>
                    </div>
                    <div class="text">
                        Save Network
                    </div>
                </button>
            </form>
            <div class="footer">
                <div class="container">
                    <div class="square black">
                        <div class="square">
                            <div class="square black">
                                <div class="square">
                                    <div class="square black">
                                        <div class="square">
                                            <div class="square black">
                                                <div class="square">
                                                    <div class="square black">
                                                        <div class="square">
                                                            <div class="square black">
                                                                <div class="square">
                                                                    <div class="square black">
                                                                        <div class="square">
                                                                            <div class="square black">
                                                                                <div class="square">
                                                                                    <div class="square black">
                                                                                        <div class="square">
                                                                                            <div class="square black">
                                                                                                <div class="square">
                                                                                                    <div class="square black">
                                                                                                        <div class="square">
                                                                                                            <div class="square black">
                                                                                                                <div class="square">
                                                                                                                    <div class="square black">
                                                                                                                        <div class="square">
                                                                                                                            <div class="square black">
                                                                                                                                <div class="square">
                                                                                                                                    <div class="square black">
                                                                                                                                    </div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>
                                                                                                                    </div>
                                                                                                                </div>
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </div>
                                                                                                </div>
                                                                                            </div>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
